version: '3.9'

services:

  mysql:

    image: mysql:5.7

    container_name: football_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: football_club

    ports:
      - "3306:3306"

    volumes:
      - ./mysql.sql:/docker-entrypoint-initdb.d/mysql.sql